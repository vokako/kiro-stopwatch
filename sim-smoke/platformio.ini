; Desktop smoke test: builds M5Unified + M5GFX against SDL2 on the host,
; so UI code can be iterated without flashing hardware.
; Libraries come from the local reference clones in ../references/projects.

[platformio]
default_envs = native

[env:native]
platform = native
build_type = debug
lib_extra_dirs = ../references/projects
lib_deps = M5Unified, M5GFX
build_flags =
    -O0 -std=c++17 -lSDL2
    -I"${sysenv.HOMEBREW_PREFIX}/include/SDL2"
    -L"${sysenv.HOMEBREW_PREFIX}/lib"
    -DM5GFX_BOARD=board_M5StopWatch
    -DM5GFX_SCALE=1
