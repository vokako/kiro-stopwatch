; swlink firmware for M5Stack StopWatch (C152): exposes buttons, touch, IMU,
; power, RTC, haptics, speaker, mic and display to the host over USB CDC.
; Protocol: docs/design-docs/swlink-architecture.md
; Two environments share one source tree (see AGENTS.md).

[platformio]
default_envs = stopwatch

[env]
lib_extra_dirs = ../references/projects
; M5Unified/M5GFX come from references/projects (patched clones); ArduinoJson from the registry, pinned.
lib_deps = M5Unified, M5GFX, bblanchon/ArduinoJson@7.4.3
lib_ldf_mode = deep+

[env:stopwatch]
platform = espressif32 @ 6.12.0
board = esp32s3box
framework = arduino
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
upload_speed = 460800
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

[env:native]
platform = native
build_type = debug
build_flags =
    -O0 -std=c++17 -lSDL2
    -I"${sysenv.HOMEBREW_PREFIX}/include/SDL2"
    -L"${sysenv.HOMEBREW_PREFIX}/lib"
    -DM5GFX_BOARD=board_M5StopWatch
