[project]
name = "swlink"
version = "0.1.0"
description = "Host driver for the M5Stack StopWatch: key mapping, sensor hub, WebSocket API"
requires-python = ">=3.11"
dependencies = [
    "pyserial==3.5",
    "pynput==1.8.1",
    "websockets==15.0.1",
    "sounddevice==0.5.1",
    "numpy==2.3.2",
    "bleak==1.1.1",
]

[project.scripts]
swlink = "swlink.cli:main"

[dependency-groups]
dev = ["pytest==8.4.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swlink"]
artifacts = ["swlink/ui/*", "swlink/*.toml"]
